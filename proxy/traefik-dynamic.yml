# =============================================================================
# Traefik dynamic configuration
# =============================================================================

# HTTP → HTTPS redirect middleware (referenced by routers via @file)
http:
  middlewares:
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true

    # Uncomment to add basic-auth to the Traefik dashboard
    # dashboard-auth:
    #   basicAuth:
    #     users:
    #       - "admin:$apr1$... hashed password ..."

  # Optional: a router for the Traefik dashboard itself
  # routers:
  #   dashboard:
  #     rule: Host(`${SLIPWAY_DOMAIN}`) && PathPrefix(`/dashboard`) || PathPrefix(`/api`)
  #     entryPoints: https
  #     service: api@internal
  #     middlewares: [dashboard-auth]
  #     tls:
  #       certResolver: le

# TLS options
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_AES_128_GCM_SHA256
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      sniStrict: true
