# =============================================================================
# Slipway — nginx site config (template, envsubst'd at container start)
# =============================================================================
# Variables substituted from the environment:
#   ${SLIPWAY_DOMAIN}        — your hostname, e.g. slipway.example.com
#   ${SLIPWAY_ENABLE_TLS}    — "true" or "false"
# =============================================================================

# HTTP — always present, either redirects to HTTPS (when TLS on) or serves directly
server {
    listen 80;
    listen [::]:80;
    server_name ${SLIPWAY_DOMAIN};

    # ACME challenge passthrough for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # When TLS is enabled, redirect everything else to HTTPS
    #if (${SLIPWAY_ENABLE_TLS} = "true") {
    #    return 301 https://$host$request_uri;
    #}

    # When TLS is disabled, proxy directly over HTTP
    location / {
        limit_req zone=slipway burst=40 nodelay;

        proxy_pass http://slipway:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket support (live logs, command palette, etc.)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Long-running builds — don't time out
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        # Streaming responses
        proxy_buffering off;
        proxy_cache off;
    }
}

# HTTPS server — only active when SLIPWAY_ENABLE_TLS=true
# To enable: set SLIPWAY_ENABLE_TLS=true and place certs in ./proxy/certs/
# as fullchain.pem and privkey.pem, then restart nginx.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${SLIPWAY_DOMAIN};

    #ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern TLS — Mozilla intermediate compatibility (Sep 2024)
    #ssl_protocols TLSv1.2 TLSv1.3;
    #ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    #ssl_prefer_server_ciphers off;
    #ssl_session_timeout 1d;
    #ssl_session_cache shared:SSL:10m;
    #ssl_session_tickets off;
    #ssl_stapling on;
    #ssl_stapling_verify on;

    # HSTS
    #add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        limit_req zone=slipway burst=40 nodelay;

        proxy_pass http://slipway:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        proxy_buffering off;
        proxy_cache off;
    }
}
