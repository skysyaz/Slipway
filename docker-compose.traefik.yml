# =============================================================================
# Traefik reverse proxy — automatic HTTPS via Let's Encrypt
# =============================================================================
# Traefik labels Slipway's container directly and routes traffic based on the
# Host rule. ACME certs are provisioned automatically.
#
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
#
# Requirements:
#   • SLIPWAY_DOMAIN must point at this server's public IP (A record).
#   • Ports 80 and 443 must be reachable from the internet.
#   • Set ACME_EMAIL in .env to your email (required by Let's Encrypt).
# =============================================================================

services:
  slipway:
    depends_on:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=slipway-net"
      # HTTP router — redirects to HTTPS
      - "traefik.http.routers.slipway-http.rule=Host(`${SLIPWAY_DOMAIN:?SLIPWAY_DOMAIN must be set}`)"
      - "traefik.http.routers.slipway-http.entrypoints=http"
      - "traefik.http.routers.slipway-http.middlewares=https-redirect@file"
      # HTTPS router — the main entry
      - "traefik.http.routers.slipway.rule=Host(`${SLIPWAY_DOMAIN:?SLIPWAY_DOMAIN must be set}`)"
      - "traefik.http.routers.slipway.entrypoints=https"
      - "traefik.http.routers.slipway.tls=true"
      - "traefik.http.routers.slipway.tls.certresolver=le"
      - "traefik.http.routers.slipway.service=slipway"
      - "traefik.http.services.slipway.loadbalancer.server.port=3000"
      - "traefik.http.services.slipway.loadbalancer.server.scheme=http"
      - "traefik.http.services.slipway.loadbalancer.passhostheader=true"
      # Security headers middleware
      - "traefik.http.middlewares.slipway-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.slipway-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.slipway-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.slipway-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.slipway-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.slipway-headers.headers.referrerPolicy=no-referrer-when-downgrade"
      - "traefik.http.routers.slipway.middlewares=slipway-headers"
      # WebSocket support — Traefik handles it automatically, no extra config

  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # Traefik dashboard — remove in production or protect it
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./proxy/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./proxy/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-certs:/letsencrypt
    environment:
      SLIPWAY_DOMAIN: ${SLIPWAY_DOMAIN:?SLIPWAY_DOMAIN must be set}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set for Let's Encrypt}
    networks:
      - slipway-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  traefik-certs:
