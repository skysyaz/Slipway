# =============================================================================
# Slipway — base compose file
# =============================================================================
# This file defines the Slipway service itself. It does NOT expose any host
# ports — pick a reverse-proxy option to expose Slipway to the network:
#
#   • docker compose -f docker-compose.yml -f docker-compose.direct.yml up -d
#       → Slipway on http://<server>:8080  (no proxy, HTTP only)
#
#   • docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
#       → Caddy on :80 and :443 with automatic Let's Encrypt HTTPS
#
#   • docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d
#       → Nginx on :80 and :443 (HTTPS with your cert, or via certbot)
#
#   • docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
#       → Traefik on :80 and :443 with automatic Let's Encrypt HTTPS
#
# Or just run ./install.sh and pick an option interactively.
# =============================================================================

services:
  slipway:
    image: ghcr.io/slipway/server:1.4.2
    # To build from source instead, comment out `image:` and uncomment:
    # build: .
    restart: unless-stopped
    environment:
      # Admin login — CHANGE THE PASSWORD in .env before exposing to the internet
      SLIPWAY_ADMIN_USER: ${SLIPWAY_ADMIN_USER:-admin}
      SLIPWAY_ADMIN_PASSWORD: ${SLIPWAY_ADMIN_PASSWORD:-admin}

      # Where Slipway stores its SQLite DB, certs, and uploaded artifacts
      SLIPWAY_DATA_DIR: /data

      # Slipway is always behind one of our reverse proxies in this setup
      SLIPWAY_BEHIND_PROXY: "true"

      # Cluster identifier shown in the UI
      SLIPWAY_CLUSTER_ID: ${SLIPWAY_CLUSTER_ID:-helix-eu}

      # Timezone for cron schedules and log timestamps
      TZ: ${TZ:-UTC}

      # Optional: SMTP for email notifications
      # SMTP_URL: ${SMTP_URL:-}

      # Optional: S3-compatible backup target
      # SLIPWAY_BACKUP_S3_URL: ${SLIPWAY_BACKUP_S3_URL:-}
      # SLIPWAY_BACKUP_S3_BUCKET: ${SLIPWAY_BACKUP_S3_BUCKET:-}
      # SLIPWAY_BACKUP_S3_ACCESS_KEY: ${SLIPWAY_BACKUP_S3_ACCESS_KEY:-}
      # SLIPWAY_BACKUP_S3_SECRET_KEY: ${SLIPWAY_BACKUP_S3_SECRET_KEY:-}
      # SLIPWAY_BACKUP_S3_REGION: ${SLIPWAY_BACKUP_S3_REGION:-}
    volumes:
      - slipway-data:/data
      # Slipway manages Docker containers on the host — mount the Docker socket.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - slipway-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 256m

networks:
  slipway-net:
    name: slipway-net
    driver: bridge

volumes:
  slipway-data:
