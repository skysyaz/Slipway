services:
  slipway:
    image: slipway:latest
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.docker.network=dokploy-network
        - traefik.http.routers.slipway.rule=Host(`slipway.skysyaz.my`)
        - traefik.http.routers.slipway.entrypoints=websecure
        - traefik.http.routers.slipway.tls.certresolver=letsencrypt
        - traefik.http.services.slipway.loadbalancer.server.port=3000
      resources:
        limits:
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 256m
    environment:
      SLIPWAY_ADMIN_USER: admin
      SLIPWAY_ADMIN_PASSWORD: admin
      SLIPWAY_DATA_DIR: /data
      SLIPWAY_BEHIND_PROXY: "true"
      SLIPWAY_CLUSTER_ID: helix-eu
      TZ: UTC
    volumes:
      - slipway-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dokploy-network

volumes:
  slipway-data:

networks:
  dokploy-network:
    external: true
